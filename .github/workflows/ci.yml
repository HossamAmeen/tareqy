name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests on PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tariqi
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: tariqi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tariqi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgres://tariqi:ci-password@localhost:5432/tariqi
      HEALTH_CHECK_PASSWORD: ci-health-secret
      CELERY_ENABLED: 'False'
      SMS_BACKEND: apps.accounts.sms.LocMemSMSBackend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r requirements/development.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      # PostgreSQL (not SQLite) so the row-lock concurrency tests actually run instead of being skipped.
      - run: python -m pytest --cov=. --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (format, lint, types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx prettier --check src
      - run: npx eslint src
      - run: npx vue-tsc -b
      - run: npx vitest run
      - run: npx vite build

  e2e:
    name: E2E (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      # The backend and the Vite dev server are started by frontend/playwright.config.ts (webServer),
      # so this job only provides the toolchains and env they need.
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      HEALTH_CHECK_PASSWORD: ci-health-secret
      SMS_BACKEND: apps.accounts.sms.ConsoleSMSBackend
      # frontend/e2e/backend.sh defaults to backend/.venv; CI has no venv, so use the setup-python interpreter.
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: pip install -r ../backend/requirements/development.txt
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7
