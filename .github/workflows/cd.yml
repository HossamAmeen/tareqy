# NOT EXERCISED: written from the existing deploy scripts/compose files but never run. See docs/cd.md.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  build:
    name: Build and push images
    # For workflow_run only continue when CI passed; tag pushes build directly.
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push backend image (production Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/docker/production/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend static bundle
        working-directory: frontend
        run: |
          npm ci
          npx vue-tsc -b
          npx vite build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 30

  deploy-staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - uses: ./.github/actions/deploy
        with:
          environment: staging
          sha: ${{ needs.build.outputs.sha }}
          ssh-host: ${{ secrets.DEPLOY_HOST }}
          ssh-user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          app-path: ${{ vars.DEPLOY_APP_PATH }}
          frontend-path: ${{ vars.DEPLOY_FRONTEND_PATH }}
          mode: ${{ vars.DEPLOY_MODE }}

  deploy-production:
    name: Deploy to production
    # Only for version tags; the `production` Environment must have required reviewers (manual approval).
    if: github.ref_type == 'tag'
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - uses: ./.github/actions/deploy
        with:
          environment: production
          sha: ${{ needs.build.outputs.sha }}
          ssh-host: ${{ secrets.DEPLOY_HOST }}
          ssh-user: ${{ secrets.DEPLOY_USER }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          ssh-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          app-path: ${{ vars.DEPLOY_APP_PATH }}
          frontend-path: ${{ vars.DEPLOY_FRONTEND_PATH }}
          mode: ${{ vars.DEPLOY_MODE }}
