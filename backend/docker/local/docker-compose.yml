# Local development. Optional Celery services: docker compose --profile celery up
name: tariqi-local

x-backend: &backend
  build:
    context: ../..
    dockerfile: docker/local/Dockerfile
  env_file: ../../.env
  environment: &backend-env
    DATABASE_URL: postgres://tariqi:tariqi@db:5432/tariqi
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    RATELIMIT_CACHE_URL: redis://redis:6379/2
    RUN_MIGRATIONS: "True"
  volumes:
    - ../..:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  backend:
    <<: *backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as u; u.urlopen(u.Request('http://localhost:8000/api/health/', headers={'X-Health-Check-Token': os.environ['HEALTH_CHECK_PASSWORD']}), timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tariqi
      POSTGRES_PASSWORD: tariqi
      POSTGRES_DB: tariqi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tariqi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  celery-worker:
    <<: *backend
    profiles: [celery]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "False"
      CELERY_ENABLED: "True"
    command: celery -A config worker --loglevel=INFO

  celery-beat:
    <<: *backend
    profiles: [celery]
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "False"
      CELERY_ENABLED: "True"
      CELERY_BEAT_ENABLED: "True"
    command: celery -A config beat --loglevel=INFO

volumes:
  pgdata:
