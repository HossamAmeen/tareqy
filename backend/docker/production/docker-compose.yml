# Production stack. Run from the backend directory:
#   docker compose --env-file .env -f docker/production/docker-compose.yml up --build -d
# Celery services start only with: --profile celery
name: tariqi-production

x-backend: &backend
  build:
    context: ../..
    dockerfile: docker/production/Dockerfile
  env_file: ../../.env
  environment: &backend-env
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    RATELIMIT_CACHE_URL: redis://redis:6379/2
    RUN_MIGRATIONS: "False"
  volumes:
    - static:/app/static
    - media:/app/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  backend:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "True"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as u; u.urlopen(u.Request('http://localhost:8000/api/health/', headers={'X-Health-Check-Token': os.environ['HEALTH_CHECK_PASSWORD']}), timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  celery-worker:
    <<: *backend
    profiles: [celery]
    command: celery -A config worker --loglevel=INFO

  celery-beat:
    <<: *backend
    profiles: [celery]
    command: celery -A config beat --loglevel=INFO

  nginx:
    image: nginx:1.27-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ../nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  static:
  media:
